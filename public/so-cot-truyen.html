const PLOT=["■ 1. Bối cảnh Phủ Hách Triều\n[Phủ Hách Triều] Từng là thời đại phồn hoa. Người dân khao khát đến kinh thành như một giấc mộng an cư. Thoái trào do ngoại xâm (từ Bắc Quốc, Nam Quốc), thiếu quân đội, quân phiệt hình thành, thế lực tôn giáo hoành hành. Trai tráng tận dụng sự lớn mạnh của tôn giáo, gia nhập đạo giáo để không phải tòng quân. Đa số trở thành đệ tử của Thái Bình Đạo. đồng dc dùng để đúc vũ khí cũng bị TBĐ dùng để đúc tượng thờ. [sự kiện thiếu quân đội] năm 800, thuộc Phủ Hách Triều; năm 850, Phủ Hách Triều; năm 830, Phủ Hách Triều; năm 853, Phủ Hách Triều; năm 868, Phủ Hách Triều; năm 869, Phủ Hách Triều; năm 870, PHT; năm 873, PHT; năm 876, PHT; năm 877, PHT; năm 871, PHT.", "■ 2. Hai đạo giáo và Liệt Lao\nhai thế lực tôn giáo lớn trỗi dậy, gồm Thái Bình Đạo, và Minh Giáo. Vì Minh Giáo nhận người từ làng mồ côi, không phân biệt được thuộc đạo giáo nào. Liệt lao: nhà tù diễn ra tranh chấp địa phận giữa Minh Giáo và Thái Bình Đạo. Nơi này luân phiên đổi chủ giữa hai bên. [Điểm bắt đầu phá án, tìm manh mối]", "■ 3. Lâm Thu, Mạnh Lịch và Lâm Quyền\nLâm Thu và Mạnh Lịch iu nhau, đẻ ra Lâm Quyền. GĐ thuộc hai tôn giáo, bị cấm cản. Lâm Thu là ng Minh Giáo, Mạnh Lịch là ng Thái Bình Đạo. Gia đình Lâm Thu phản đối mối quan hệ và giết Mạnh Lịch. Lâm Thu khi ấy đang mang thai. Sau khi sinh, đứa con đầu lòng của nàng bị gia đình đưa đến một ngôi làng xa. Trước khi con bị mang đi, Lâm Thu để lại một dấu xăm dưới lòng bàn chân để sau này nhận dạng. Đứa trẻ tên Lâm Quyền. Trong thời kỳ chiến tranh, Lâm Quyền bị người Minh Giáo phát hiện và bắt giữ -> sao lại bị bắt, cùng giáo mà, đưa vào Liệt Lao. Lâm Thu lần theo dấu vết đến đó. Lâm Thu đến Liệt lao tìm con. Nàng xâm nhập Minh Giáo, sau đó gia nhập Thái Bình Đạo và nhận nhiệm vụ ám sát người thừa kế Minh Giáo. Cuối cùng trở thành tù binh nơi này. Nhưng vì công trạng lớn đối với Thái Bình Đạo, khi nàng ra tù được họ bảo kê và cấp nơi an cư. bị Bách Hải xâm hại. Đẻ ra Lâm An, Lâm Bách. Lâm Thu đc thả khỏi Liệt lao. Lâm An Lâm Bách 3 tuổi. Lâm An thất lạc khỏi mẹ, đến Thịnh gia thôn. Lâm Thu trao Lâm An và Lâm Bách mỗi ng một nửa mặt dây chuyền. [Điểm bắt đầu phá án, tìm manh mối]", "■ 4. Bách Hải (Lâm Quyền): Vạn Phúc và Diệu Vọng Tháp\nBách Hải giả làm Vạn Phúc. Bách Hải nuôi tâm tư, thù hận (cnay làm rõ ra là hận những gì) sau chuyện cũ. Mối bi kịch của hắn xuất phát từ thời cuộc và bản thân, cuối cùng lại phá tan gia đình hắn. Bách Hải nuôi quân, tập hợp thế lực, phát động binh biến. Bách Hải giả làm cao nhân Thái Bình Đạo, lấy tên Vạn Phúc, lừa niềm tin tín đồ. Hắn đứng trên đỉnh Diệu Vọng Tháp, sử dụng một pháp bảo lợi dụng hiện tượng vật lý để tạo ra vầng hào quang và có thể chữa được chút bệnh tật do thiếu ánh sáng, sức khỏe để lùa ng dân tin rằng hắn thật sự là cao nhân hiển thế. Ultimate goal của Bách Hải: cố sống sót để tìm kiếm gia đình, làm mọi cách để sinh tồn dẫu giẫm đạp lên ngkhac. cuối cùng giẫm lên chính gđ và ng mình thương iu. Điên quá hoá phản. Phủ Hách Đế dùng Bách Hải để răn đe, kiềm hãm sự hoành hành của tôn giáo và các trai tráng trốn ngũ. [Binh biến Bách Hải] Trong bài giảng cuối, Bách Hải tuyên bố những ng thật sự sùng đạo, tin thần hãy theo hắn lên núi, lánh nạn diệt vong. Một số tín đồ sùng đạo theo hắn, số còn lại do chỉ lợi dụng tôn giáo nên không nghe theo, vẫn ở lại căn cứ. Trong đêm, quân lính triều đình vây căn cứ, phóng hỏa thiêu rụi mọi thứ. Ng sống càng tin vào Bách Hải, danh tiếng hắn cũng lan rộng. Những kẻ lợi dụng tôn giáo để trốn nghĩa vụ cũng bị răn đe. Thế lực Thái Bình Đạo bị kiềm hãm. căn cứ Thái Bình Đạo bị sụp đổ.", "■ 5. Lâm An, Triệu Lan và Bách Hải\nLâm An 18 tuổi, bị ép minh hôn. Được Bách Hải (38t) cứu giúp. Lâm An đem lòng ái mộ ân nhân. Đem một nửa mặt dây chuyền của mình trao cho Bách Hải. Bách Hải cũng có tình cảm với nàng nhưng chia đôi do con đường sống khác biệt. Bách Hải trao cho Lâm An một thanh kiếm để tự vệ và bắt đầu cuộc sống mới. Họ gửi thư tín hai năm. Sau đó dừng lại. Bách Hải gửi nàng một nửa mảnh pháp quang (dùng trên Diệu Vọng Tháp) Lâm An dùng tên mới Triệu Lan, bôn ba giang hồ. Bị mù một mắt. Tự ti khi gặp lại cố nhân. Mỗi ng đều có lý do riêng để rời khỏi cuộc đời đối phương. Bách Hải và Triệu Lan gặp lại. Nàng nhận ra hắn, hắn không nhận ra nàng, bởi Lâm An ngày trước vẫn còn là một thiếu nữ chưa mù, còn Triệu Lan hiện tại đã trở thành một nữ kiếm khách mù. Trên người hắn có thứ nàng nhận ra ngay lập tức, nửa mặt dây chuyền mà nàng từng trao cho ân nhân năm xưa. [Điểm bắt đầu phá án, tìm manh mối] Triệu Lan nhận nhiệm vụ, trở thành kẻ phản quốc trong mắt giang hồ để hộ tống đoàn sứ thần theo ý Bách Hải, đổi lại nàng sẽ nhận lấy một đôi mắt sáng. Cuối cùng TL bị nghĩa sĩ truy đuổi đến chết, cô độc ra đi trong hang động. Mã Thái, một nghĩa sĩ giang hồ yêu nước, từng sát cánh bên cạnh Triệu Lan. Được giang hồ tung hô. Cuối cùng lại là người tố cáo nơi ẩn nấp của Triệu Lan cho giang hồ xử tử. Vì hắn mãi không hiểu vì sao Triệu Lan lại phản quốc.", "■ 6. Lâm Thu qua đời, Lâm Bách tìm chân tướng\nLễ hội tẩy tội tổ chức hằng năm. Lâm Thu gặp Bách Hải. Biết dc hắn hóa ra là Lâm Quyền, đổ bệnh r qua đời 1 năm sau. Lâm Thu die, Lâm Bách điều tra về cái chít mẫu thân -> từ từ nhìn ra chân tướng. Tìm đến gặp Bách Hải và tiết lộ sự thật.", "■ 7. Hoài Lịch giữ Hà Tây\n[năm 885, PHT] [Trấn bắc tướng Chu Khải] Triều đình trở nên đa nghi, dè chừng võ tướng, tiết độ sứ. Hoạn quan thao túng càng nặng nề. [năm 885, PHT] [Trấn bắc tướng Hoài Lịch] Loạn Bách Hải bùng nổ, Phủ Hách Triều điều quân từ biên ải phía Bắc về kinh thành, khiến vùng biên thùy suy yếu. Bắc Quốc nhân cơ hội chiếm Hà Tây (châu ở biên giới phía Bắc của Phủ Hách), cắt đứt liên lạc giữa nơi này và triều đình. Năm 885, Hoài Lịch được cử đến Hà Tây, nhưng khi ông tới nơi, các châu Hà Tây đều đã thất thủ. Ông cùng tàn quân Phủ Hách cố thủ tại Thành An Quân, chờ viện binh nhưng không bao giờ được triều đình cứu viện thực sự. Sau khi A châu, B châu và C châu lần lượt thất thủ, quân Phủ Hách chỉ còn giữ được D châu. Đến năm 895, D châu thất thủ, Hoài Lịch qua đời. Lá cờ cuối cùng của Phủ Hách tại đây cũng bị hạ xuống. Ng dân bị cô lập, quân lính khát vọng về quê, Hoài Lịch một đời trấn thủ, vẫn mãi ko dc triều đính hồi đáp. Trung nghĩa đổi lấy sự bỏ mặc.", "■ 8. Chu Khải và Chu Thâm: Tận Trung quân\nChu Khải xuất thân từ một gia tộc hào tộc ở Hà Tây. Năm 895, ông khởi binh thu phục A Châu, sau đó lần lượt giành lại mười một châu Hà Tây và thành lập Tận Trung quân. Tuy nhiên, chiến thắng không giúp ông có được quyền tự chủ lâu dài. Triều đình dần nghi kỵ thế lực của ông, cuối cùng triệu ông về kinh thành, thực chất là giữ ông lại làm con tin chính trị. Chu Thâm là cháu của Chu Khải, người tiếp quản Tận Trung quân sau khi chú mình rời khỏi Hà Tây. Ông dành nhiều năm bảo vệ vùng đất này, khôi phục đời sống dân chúng và chống lại các thế lực bên ngoài. Nhưng quyền lực của ông khiến triều lần nữa đình nghi kỵ, trong khi nội bộ Tận Trung quân cũng dần chia rẽ vì tranh đoạt quyền kế thừa. Năm 899, các thế lực trong quân, gia tộc và triều đình cùng tham gia vào âm mưu lật đổ ông. Chu Thâm bị hạ độc, vu cáo phản nghịch rồi sát hại. Những người trung thành với ông bị thanh trừng, công lao và dấu tích của ông cũng bị xóa bỏ.", "■ 9. Binh biến Vương Việt, mở ra Đại Hòa\n[885 - 900, PHT] Nhiều binh biến diễn ra do ng dân đói khổ, phẫn nộ. Thế lực quân phiệt tranh thủ đoạt quyền, đất nước chia cắt, mỗi nơi một thế lực cai quản. Binh biến Bách Hải thất bại nhưng triều đình Phủ Hách suy yếu. Bonus thoái trào sẵn trc đó nên càng yếu hơn. Về việc lý do đế binh biến. Đoạn đấy để mạch dẫn từ từ, để ng chơi khám phá ra bi kịch của trung sĩ đều do triều đình nhúng tay -> tiền đề cho tân đế lên ngôi. Để nô bộc trung thành vs tiền triều cố gắng phục hưng phủ hách tra lại quá khứ về tân đế để phản y, cúi cùng bít dc do triều mình nát trước -> hối hận xanh ruột đứng trước nhiều lựa chọn -> nhận tội quay xe hoặc ôm theo uất ức từ trần vì bị hại chết do acb. Vương Việt vốn là võ tướng của Phủ Hách Triều, cũng là đệ tử của Hoài Lịch, bạn thân của Chu Thâm. Nhìn cảnh trung sĩ bị đối xử dưới đao kiếm tuyệt tình của triều đình, ông quyết định trở thành người cầm quân binh biến. năm 900. Vương Việt binh biến. Mở ra triều đại mới - Đại Hòa. [Đại Hòa] [Điểm bắt đầu phá án, tìm manh mối]", "■ 10. Mục tiêu plot Cao gia: Vương Việt và Vương Tài\nGoal của plot Cao gia: Vương Việt và Vương Tài bất hoà trong quá khứ, khác biệt tư tưởng chính trị. Vương Việt muốn thống nhất đất nước để chấm dứt chiến tranh bằng vũ lực. Mục đích cao cả là đòi lại quê hương, dù phải hy sinh mấy ng khác. Vương Tài muốn hoà hoãn + chính sách hoà bình, thoả hiệp với Nam Quốc (dù phải cống nạp đất)", "■ 11. Kết minh Bắc Nam Quốc và vụ ám sát sứ thần\nKế hoạch kết minh giữa Nam Quốc và Bắc Quốc. Hai nước này vốn là thế lực thù địch của Phủ Hách Hòa. Lần này muốn kết minh. Tuy nhiên do vị trí địa lý, sứ thần Bắc Quốc phải đi ngang qua Phủ Hách để đến Nam Quốc. kế hoạch kết minh của Nam và Bắc quốc bị mưu tính ngược. Bách Hải dựa vào danh tiếng của Thái Bình Đạo (Bắc Quốc rất sùng đạo này), len lỏi vào đoàn hộ tống sứ thần với tư cách Vạn Phúc. Nghĩa sĩ giang hồ Phủ Hách khi nghe tin đoàn sứ thần Bắc Quốc đi ngang thì hận thù cũ, ân oán chiến tranh nên rất muốn giết hại đoàn sứ thần này. Bách Hải thuê Triệu Lan, thay hắn giải quyết nghĩa sĩ Phủ Hách, để đảm bảo đoàn sứ thần tới Nam Quốc an toàn. Thành công đưa sứ thần đến Nam Quốc, tại đất Nam Quốc, Bách Hải ám sát sứ thần Bắc Quốc, đổ tội lên đầu Nam Quốc. Khiến việc kết minh giữa hai nước này sụp đổ. Bách Hải aka Vạn Phúc giết dc sứ thần, trốn thoát và lập công dưới thời của Phủ Hách Đế. Thành võ tướng.", "■ 12. Tiền tệ ba thời kỳ và cách mở đầu vụ án tiền giả\nNếu về tiền giả, phải thiết lập thêm phần tên tiền tệ của tiền triều, công dụng ở tiền triều. Sau khi đến triều đại mới là tiền mới -> đang lưu hành sử dụng role. Tức sẽ có 3 cơ chế tiền, tiền của tiền triều, tiền giả trong án do chúng ta viết như nào đấy, tiền của tân triều. Nó chỉ tồn tại qua manh mối, lời kể thôi. Vì điểm bắt đầu role của chúng ta là tân triều. Chèn vào 1 vài phúc lợi. Như kiểu có 1 loại tiền đặc biệt dùng ở chợ đen, buôn bán dc tin tức, vật phẩm gì gì đó. Để giới thiệu ng chơi đến loại tiền này. Xong ú oà nó là tiền nhà nc cấm. Sau đó còng đầu vào ngục hết, trừ điểm hoặc quyền lợi gì đó bọn họ. Xong r cho quan trong triều xuất hiện và ban cho nvu điều tra chân tướng tiền giả hoặc ở tù. [Vụ án tiền giả]", "■ 13. Hoàng hậu, Vương Lộc và kế hoạch Sinh Kim\n[Chuyện tình với hoàng hậu] Hoàng hậu và Vương Lộc thân vương (đàn em Vương Tài, thế lực kh mạnh, núp bóng Vương Tài) thuở xưa là thanh mai trúc mã (thời PHT), nhưng vì phụ mẫu không đồng ý bởi tiểu muội của nàng cũng mến mộ thân vương. Phụ mẫu thương thứ nữ hơn đích nữ. Nên chọn gả tiểu muội cho thân vương, hoàng hậu cho đế (sau binh biến thành công), đế thật lòng yêu thương. Mọi chuyện vốn hoà thuận, sau này tiểu muội nàng mất vì khó sinh, hoàng hậu - thân vương gặp lại tiếp xúc nhiều tình xưa bén rễ. [Điểm bắt đầu phá án, tìm manh mối] Thế là thân vương dùng hoàng hậu làm con dao dưới gối đế. Hoàng hậu đã sinh 4 người con, 3 người con đế, 1 người con thân vương. Con của tiểu muội nàng được nàng nhận làm con nuôi để lấy cớ cho thân vương thăm con mà hai bên thường gặp mặt. Đế thương em, thương vợ, tin tưởng hết lòng. Còn vợ thì cắm sừng, em thì sang phe phản của Vương Tài vì kh muốn Vương Việt làm đế (do cắm sừng anh zai) Nàng bí mật hợp tác với Vương Tài, thân vương Đại Hòa, để thực hiện kế hoạch Sinh Kim. Mượn danh chiếc chén vàng được đồn có khả năng sinh ra tiền, gọi nó là cống phẩm từ Nam Quốc đến Đại Hòa, phô diễn một màn tạo ra tiền giữa thanh lâu nổi nhất dân chúng lúc bấy giờ => cống phẩm mất, tiền Phủ Hách bị tung ra giữa phố, triều đình phải điều tra + đối mặt với câu hỏi từ dân chúng. Cống phẩm Kim Sinh chén của Nam Quốc gửi đến Đại Hòa bị cướp giữa yến tiệc. Tra ra được Vương Lộc -> biết được Vương Lộc có tình cảm với Hoàng hậu. Vương Lộc và HH có tình cảm -> HH k có tình cảm với đế -> HH chọn đứa con gái với đế (A Công chúa) để đi hòa thân A công chúa có tình cảm với Trịnh Huy (bị lộ thư tình) Chồng A Công chúa chết -> đón A công chúa về cùng với đoàn sứ thần của Nam Quốc.", "■ 14. Tô Khuyết, Nam Quốc và khủng hoảng tiền tệ\nTô Khuyết, người từng nắm quyền tại Sở Thành (thuộc Nam Quốc) nhưng đã thất thế, chạy trốn và sống ẩn danh giữa dân thường ở kinh thành Đại Hòa. Nàng dần từ bỏ tham vọng quyền lực và lựa chọn cuộc sống bình dị. Nhưng trước cảnh dân chúng lầm than, nàng quyết định đứng ra can thiệp. Trong tham vọng thống nhất thiên hạ, triều đình bắt đầu chuẩn bị chiến tranh với Nam Quốc. Cùng lúc đó, Nam Quốc rơi vào khủng hoảng tiền tệ sau khi mất các mỏ đồng ở phía Bắc (do Đại Hòa thống nhất), buộc phải lưu hành tiền sắt (thiếu vàng, bạc, đồng) và đưa tiền Phủ Hách vào đất Đại Hòa. Tô Khuyết dc nhận nhiệm vụ từ Nam Quốc, rằng xâm nhập và làm lủng đoạn kinh tế của Đại Hòa. Đổi lại khôi phục địa vị và trở về Nam Quốc. Nam Quốc cũng đứng ra ủng hộ Vương Tài. Đổi lại khi lên ngôi phải để Nam Quốc yên + giao một phần đất. Lo ngại tiền tệ mất giá, triều đình Đại Hòa ban lệnh thu hồi toàn bộ tiền Phủ Hách cũ. Tuy nhiên, chính sách nhanh chóng bị quan lại lợi dụng để trục lợi, khiến dân chúng mất đi tài sản. Trong khi đó, lương thực bị giữ lại để cung ứng quân đội, đẩy kinh thành vào nạn đói nghiêm trọng. (cnay phải làm rõ xem chính sách như nào, lợi dụng ra sao...) Thế lực kho lương của Vương Tài thu nhận tiền Phủ Hách, nhằm gây dựng danh tiếng và thực quyền. Đồ ăn thực sự được đưa cho dân đói, để họ tung hô bảo vật Nam Quốc + Vương Tài. Kế hoạch vừa giúp người dân vượt qua nạn đói, vừa gây sức ép lên chính sách tiền tệ của triều đình Đại Hòa, qua đó trì hoãn cuộc chiến với Nam Quốc. [Kho lương riêng của Vương Tài] [Điểm bắt đầu phá án, tìm manh mối]", "■ 15. Tân đế vi hành, tin đồn cầu trường sinh và yến tiệc\n[Tân đế vi hành, cầu trường sinh] Sau sự kiện tiền giả không lâu, tiều đình đang gây dựng lại thế lực, tích lương cho dân. Nhưng tin tức bị biến tấu, tuồn ra ngoài. Nguồn tin từ giang hồ truyền đến, trong cung có bảo vật. Chỉ cần hiệp khách đột nhập dc vào, sẽ có kho báu. Tin còn lan ra rằng, cấm quân, võ ty của kinh thành đã bị mua chuộc, ma quỷ quấy phá, có thể an tâm đột nhập. Ma quỷ là do bọn đầu xỏ bày ra, tin đồn cũng do bọn chúng thêu dệt. Không có bảo vật nào cả. Mục đích: gây nhiễu lực lượng phòng vệ trong cung. Để kẻ thích khách thật sự có thể lẻn vào. Mục đích 2: bảo vật dc đồn ở quân khố, kho lương. Triều đình vừa thành lập, dân còn đói. Đột nhập vào để tung tin ra rằng, vua tích tài sản, vơ vét của dân. Khuấy động triều chính, để ngự sử đàn hặc đế. Những kẻ giang hồ thật sự tin vào lời đồn, đến quấy phá kinh thành kh ngớt. Tuy quân lực vệ cung của triều đình đủ đối phó, nma kh thể cứ dồn lực lượng vào xử lý đám ng này. Trong cung cũng dấy lên tin có ma. Triều đình/ng chơi tương kế tựu kế, quyết định mời cao nhân dự yến tiệc xem bảo vật. Phàm là những kẻ có bản lĩnh, vượt qua dc lính canh để đột nhập vào yến tiệc, đều dc chia một phần bảo vật. Mục đích: cho kẻ chủ mưu cơ hội lẻn vào, bắt hắn phải lộ diện. Kết quả: vài đại hiệp lẻn vào dc yến tiệc, dc triều đình ban châu báu, ân xá tội lỗi nếu quy phục Đại Hòa, phục vụ nhân dân. Thích khách thật lộ diện -> chém Hàn Huân.\nTH1: Đế kh phòng bị, die\nTH2: Đế phòng bị, cho ng làm thế thân, chạy thoát, sống\nTH3: Đế cho mai phục, thích khách die tại chỗ\nTH2: sau khi khống chế dc thích khách, đế vào điện riêng trò chuyện với Diệp Phong aka 1 vị quan văn tiền triều, chọn quy phục theo Đế.", "■ 16. Lâm Bách, Thượng gia và hai tuyến điều tra\nNếu chỉ án bách tính thì để bách tính kết hợp quan địa phương phá. Nhân vật Lâm Bách tập hợp lực lượng với vài quan tiền triều + địa phương để chống phá tân đế. (đoạn mở đầu) R sau đó cho quan địa phương, quan lquan và bách tính lquan phá án vụ này + backstory nv Lâm Bách, Bách Hải. Án ở bách tính. Đế vi hành -> Vi hành cũng có thể 1 phần giúp dân và dựng nền để đế hiểu lòng dân -> kết he cho vụ tiền giả. Vi hành -> nghe tin đồn đế cầu trường sinh do thế lực Lâm Bách tung ra -> điều tra thân phận Lâm Bách -> mở lại liên hoàn án Bách Hải năm xưa. [Điểm bắt đầu phá án, tìm manh mối] Thượng gia xung đột lợi ích với Lâm Bách. Lâm Bách được tín nhiệm cao trong dân chúng nhờ làm từ thiện, phát lương. Thượng gia đầu cơ tích lương, lợi dụng chiến tranh để trục lợi làm giàu -> hành động của Lâm Bách ảnh hưởng đến túi tiền của Thượng gia -> Thượng gia ghét -> Vương Lộc lợi dụng điểm này. Lâm Bách bị vu oan bởi thế lực Thượng gia. Thượng gia ở kinh thành, vốn là gia tộc kinh thương lớn. Gia tộc này phụ trách việc vu oan giá hoạ cho Lâm Bách, tung tin y muốn binh biến và tiết lộ Bách Hải có liên quan đến Lâm Bách nhằm vu khống y. Liên tiếp có manh mối chỉ ra rằng, Lâm Bách muốn theo chân Bách Hải lật chính quyền, vì thù hận cá nhân và lòng tham nhưng thật ra là kh phải. do Thượng gia và Trần phi giật dây. Mục đích 1: Lâm Bách có tiếng nói ở địa phương, triều đình đàn áp sẽ dấy lên sự phẫn nộ của dân chúng -> bất lợi cho tân đế. Mục đích 2: Thế lực của Vương Lộc muốn trở thành 'anh hùng' trong chuyện này, tiện tay nhận tiếng tốt và tiêu diệt Lâm Bách (vì y theo tư tưởng phản chiến) Mục đích 3: đồn tân đế cầu trường sinh để bôi nhọ danh tiếng tân đế, úp nồi lên đầu Lâm Bách để phục vụ mục đích 2. Tân đế vi hành + hoàng thất điều tra liên quan cần chia 2 tuyến điều tra song song: Điều tra về nguồn gốc Lâm Bách, Bách Hải -> liên hoàn án năm xưa ở Phủ Hách Điều tra về kẻ giật dây phía sau aka Thượng gia.", "■ 17. Vụ án Cao gia\n[Vụ án Cao gia] Cao gia từng là trung thần dưới thời Phủ Hách. Quần thần bêu xấu Cao gia, nói rằng họ phản tặc, đại nghịch bất dung do buôn lậu muối. Võ tướng nhưng không phò vua, hại nước. Bị thanh trừng là đúng. Manh mối chỉ ra Cao gia thật sự đã tích trữ gạo, lương thực, và có thế lực nuôi quân. Nhưng Cao gia chủ tận tâm phò Phủ Hách Đế. Tiết lộ thân phận của thích khách, là con của Cao gia chủ, Cao Trạch. Vì nuôi hận gia tộc mà gầy dựng thế lực chống lại Đại Hòa (bonus bị lợi dụng từ Vương Tài) Hàn Huân là thuộc hạ của Vương Việt, là ng ra tay diệt Cao gia. Cao gia có con gái từng gả cho Chu Thâm (thời Phủ Hách), con gái báo tin về mà kh thể đưa y về kinh, triều đình lạnh lẽo, thờ ơ. Tích lương nhưng hèn nhát chống trả, để trung thần chết ngoài biên ải. Nội bộ Cao gia đấu lẫn nhau. Cao gia chủ chọn trung nghĩa với Phủ Hách, Cao nhị gia thương con gái mà bán đứng anh trai cho Hàn Huân. Cao tam tư thông với phi tần tiền triều (Phủ Hách), sau khi Vương Việt binh biến thành công thì phi tần này từ bỏ Cao tam, góp phần thổi lửa cho bi kịch Cao gia để che giấu chuyện xấu của mình. Phi này có thể chọn tiếp tục vào hậu cung tân đế hoặc lui về ở ẩn. [Điểm bắt đầu phá án, tìm manh mối] Vương Việt dẫn quân đánh đến kinh thành, Cao gia là những ng đầu tiên đứng lên chống lại phản loạn. Nhưng Cao gia chủ sớm bị Hàn Huân gài người vào, rồi bị hắn ta trừ khử. Sau này đổ cho Cao gia vết nhơ để chính danh thanh trừng. Hàn Huân vẫn ung dung thành tướng lĩnh dưới Đại Hòa triều. Còn Cao gia lại bị tuyệt diệt. Bằng chứng đều là Hàn Huân ngụy tạo. Chân tướng năm đó là Cao gia được Phủ Hách Đế căn dặn riêng phải tích lương, nuôi quân. Hoàng đế nghi kỵ binh biến sẽ thật sự lan đến kinh thành. Toàn bộ quân quyền và lương thực đều do đích thân đế giám sát. Phần Cao gia, có thể cho họ mang tiếng xấu vừa thật, vừa giả đi. Trong Cao gia có kẻ gian díu với phi tần hậu cung, sinh ra con (trai gái để xem sau), sau này bị (?) phát hiện hoặc cái gì đấy mới thật sự muốn tạo phản. Nghĩa là, từng trung thành thật, sau đó bị nghi ngờ và chột dạ nên hết trung. Tuyến này cho hậu cung. Nhưng không, manh mối phía hậu cung chỉ ra Cao gia thật sự có người bại hoại.", "■ 18. Tôn Luận, Vương Tài và kết cục vụ tiền giả\nTôn Luận, phủ doãn kinh thành là ng ăn hối lộ, ăn chặn và dùng quyền lợi tịch thu tài sản dân làm của riêng. Thuộc hạ dưới trướng hắn liên tục bắt nạt ng dân. Bách tính lầm than. Tiền tham nhũng ăn chia với Vương Tài.\nOptions:\n1, Tôn Luận, để nối mạch với phần trên.\n2, Quan viên tiền triều, chọn quy phục nhưng lòng kh trung với tân đế\n3, Thẩm gia. Build mạch Thẩm gia là quan văn dưới thời PHT, chọn phản bội tiền triều để đi theo VV khi thế lực VV lớn mạnh. Thẩm gia cấu kết với Hàn Huân để bán đứng Cao gia (vốn là thế lực cạnh tranh với Thẩm thời PHT)\n4, Thế lực Minh Giáo hoặc Thái Bình Đạo nhằm gầy dựng tầm ảnh hưởng\nPhá dc đường dây của Vương Tài, Tôn Luận, sẽ nhìn ra dc đại cục và lắng nghe lòng dân -> nhà nước bảo chứng cho tiền tệ thay vì dùng đồng, kim loại để sản xuất tiền. Ngưng chiến tranh, tập trung vào ấm no cho nhân dân trc. [Điểm bắt đầu phá án, tìm manh mối]", "■ 19. Lý Hiểu và Bá gia\nLý Hiểu, là thầy thuốc xuất thân từ vùng sông Hoàng Hà. Nàng chuyên chữa bệnh cứu người. Nhưng người dân nơi đây không tin vào thuốc men, cũng không chú trọng việc đắp đê. Vì họ thờ Long Vương, nghĩ rằng chỉ cần cúng bái là đủ. Mỗi năm, Bá gia đều thỉnh Long Vương từ sông lên, mọi người cùng cầu phúc để qua mùa lũ. Sự thật là Bá gia chỉ thờ phụng một con cá chép bth, mỗi đời gia chủ đều sẽ giết và chọn một con cá mới, để biểu trưng cho sự luân hồi của thần linh. Bách Hải từng dùng cách này để thu phục lòng ng và giờ đây được Trần Tiêu (mưu sĩ dưới trướng Bách Hải) sử dụng lại để thu phục lòng người nơi đây. Mục đích thật: bòn rút tiền đắp đê vào túi riêng, để đê dởm, lũ tăng, r gọi là thần cá hiển linh. Lý Hiểu cưới Bá Vinh, thay chồng làm người kế thừa tục lệ Bá gia do Bá Vinh quá ốm yếu. Trong thời của mình, Lý Hiểu truyền bá y thuật, đánh bắt và đẩy lùi mê tín. Bà hứa vẫn quy phục triều đình Phủ Hách, chỉ cần khi thiên tai ập đến, triều đình nghe tiếng kêu của bà phải đến cứu dân. Thiên tai ập đến, nhưng đồng thời là thời điểm Vương Việt binh biến. Triều đình không hồi đáp tiếng kêu của Lý Hiểu, thư tín im bặt, gõ trống đến gãy tay cũng không được. Cuối cùng Lý Hiểu dùng tiền túi cứu trợ ng dân, r ra đi cùng Bá Vinh trong nghèo đói và bất lực trước thiên tai. Lý Hiểu cưới Bá Vinh vì y ốm yếu, tiện tranh giành quyền lực và củng cố thực quyền cho quân đội của Vương Tài. Trong thời gian này, Lý Hiểu vẫn tư thông cùng Vương Tài qua thư tín. Khi Vương Việt binh biến thành công, Vương Tài theo đó mà đổi vận, Lý Hiểu trừ khử Bá Vinh bằng cách làm từ thiện cho gđ hết tiền r Bá Vinh chít đói -> giả chết theo y để comeback với thân phận mới bên cạnh Vương Tài. Lý Hiểu có bạch nguyệt quang là Vương Tài, nma lúc này VT đang phò Vương Việt trên chiến trường nên không thể nên duyên.", "■ 20. Trịnh Huy và Công chúa A\nThì trong 4 người con này, sẽ có công chúa -> chiến tranh nảy ra phải hoà thân, nhưng lòng nàng có tình nhân rồi, bên kia là quan lại, cũng thương mà không dám nói vì chức bé. Công chúa này từ nhỏ cơ thể yếu ớt, bệnh tật triền miên. Hoà thân xong từ trần, tin tức được về làm quan lại kia lòng đau như cắt, được tiêm năng lượng càng hắc hoá, gây ra rắc rối vô cùng và mạnh tay hơn trong việc muốn xử đế. Cho họ tự quyết định, báo trước thời gian hạ màn thôi, là role đến hoà thân xong hết đất diễn rồi. Vai này là người chơi bình thường, cầm mỗi hint ẩn. Nhìn người thương bị ép gả xa không rõ về được không, sinh lòng uất hận đế, cho rằng không có tình phụ tử -> phản diện +1 nhân vật. Quan bé là Trịnh Huy. Trịnh gia vốn là gia tộc dưới thời Phủ Hách. Sinh tồn dựa vào biến chuyển theo thời cuộc, nhưng cũng trải qua vô số mất mát. Trịnh Huy lớn lên giữa những tháng ngày Binh Biến Bách Hải, sống sót nhờ con chữ và sự cưu mang của Lý Hiểu. Nhìn cái kết của sư phụ, khi trở thành Hộ bộ Thị lang, Trịnh Huy nhiều lần dâng sớ xin mở kho lương cứu dân, nhưng bất thành. Cuối cùng, hắn chọn tuồn tẩu kho lương. Dùng tiền của Vương Tài để tích trữ lương thực. Sự ra đi thảm thương của bậc vì dân như Lý Hiểu khiến Trịnh Huy hắc hoá, mất niềm tin vào chính quyền của Vương Việt. Dù y vốn là trung thần nhân nghĩa, cuối cùng cũng bị phe cánh Vương Tài dụ dỗ tuồn tẩu kho lương, trở thành mắt xích trong kế hoạch của Vương Tài.", "■ 21. Biến chuyển roleplay và kết cục\n[Biến chuyển roleplay] Nếu ng chơi hoàn thành xong 2 tuyến vụ án, có thể biết dc chân tướng -> khuyên Cao Trạch -> vua sống. Vua có thể dùng lí lẽ của mình, hoặc phương thức, để úp sọt Cao Trạch hoặc thông não chi thuật. Hoặc có ng tìm ra chân tướng Cao gia p3 (hậu cung) sẽ làm Cao Trạch phát đin.", "■ 22. Án hậu cung và Yến phi\nGoal: phát hiện Cao gia (Cao trạch) đang oán tân triều + nội bộ Cao gia có vấn đề. 1, Án nhỏ trong hậu cung (cung nhân chết hàng loạt) -> ÁN NÀY CHỈ HOÀNG HẬU ĐỨNG RA ĐIỀU PHỐI TRA (có thể giao việc tra cho phi tần/công chúa/hoàng tử,... đang ở trong cung) Yến Phi - biểu cô nương của Cao gia + Cao gia k có con gái -> coi YP như con gái/em gái để đưa vào cung Phủ Hách >< nhưng từ nhỏ Yến phi và Cao tam đã khoái nhau nhưng bị chia cắt vì YP phải vào cung -> tư thông. Án cũ: yến phi giết cung nhân biết chuyện mình tư thông và đồn do ma ám (nhưng lúc đó binh biến + triều đinh mục rỗng nên k tra) Cao Trạch muốn xiên đế -> nhờ Yến phi (h đã lên chùa Thái Bình Đạo tu) giúp (mdu đã lên chùa nma tai mắt bả vẫn còn trong cung vì xưa bả cũng quản lý HC) -> Yến phi có thể do cũng muốn trả thù cho tình cũ (Cao tam) nên đồng ý. -> tạo án trong hậu cung giống như án cũ và đồn có ma.\nÁn mới:\n+ Mở đầu: tin đồn đã mất tích sẵn vài người (cung nhân quét dọn, giặt giũ,...), HH đang trong quá trình điều tra (nma thực chất là k tra) -> cung nhân của phi tần 1 tháng được xuất cung 1 lần để đi mua đồ cthu ckiểu cho phi tần -> hôm đấy có 1 cung nhân của 1 phi tần đi mà k về -> phi tần đấy cáo trạng lên HH -> rùm beng -> tra -> tra ra cung nhân (của phi tần) bị vứt xác trong 1 giếng cạn ở .... hậu cung -> nghe thấy tiếng khóc thút thít trong hoa viên + có ng nhìn thấy ma nữ (hint) + các thể loại hint để tìm ra hung thủ (tra từ cung nhân cũ, kiểu lật lại án cũ,...) -> đổ tội/che giấu manh mối các thứ các thứ -> tra ra được Yến Phi -> hé lộ 1 phần quá khứ và oán hận của Cao gia (Yến phi giữ hint ẩn về Cao gia)\n[Mạch hậu cung]", "■ 23. Hoàng tử điều tra, Trần phi và Lan phi\n[OC điều tra] các vai hoàng tử có thể thành ng điều tra. Để nắm plot chính + cống hiến qtrong. Nếu có mạch hợp lý có thể phò vương tài và lên ngôi. Còn kh thì bị điều tra -> die. Cho họ đấu nhau thêm kịch tính thì kịch bản sẽ có thương ai hơn, không thích ai, xuất thân mẹ ruột của họ như nào. Người chơi có hint ẩn, ví dụ X hoàng tử từng say rượu lúc yến tiệc, trên đường hồi cung thấy hoàng hậu và thân vương hò hẹn. Trần phi (Trần phi là thế lực cạnh tranh trực tiếp với hoàng hậu). Trần phi gia tộc nhà mẹ quyền quý, bản tính bốc đồng nóng nảy, thật lòng yêu tân đế. Nhưng tân đế thì không. Y từng hết lòng tranh sủng để ở bên cạnh đế. Nhưng sau biến cố sảy thai mà đế lại dung túng bao che cho Yên phi, nàng lạnh lùng yêu quá hóa hận, bắt đầu nung nấu ý định xiên đế. Lan phi là nghĩa nữ của quan lại tiền triều (không ai biết), quan lại đó đã mất trong chiến loạn rồi. Lan phi được nhà khác nhận nuôi vào cung, vì xinh đẹp nên được đế để mắt và khá sủng ái. Mang ý định trả thù cho nghĩa phụ, nghĩa mẫu."];

const CASES=[{"name": "0. Tổng quan: bản đồ và tuyến giải mã", "tom": "Người chơi bắt đầu ở Đại Hòa (năm 900 trở đi). Các án nối nhau: Án tiền giả mở màn, kéo sang Lâm Bách và tin đồn trường sinh, rồi tới yến tiệc và Cao gia, hậu cung. Án Hoàng Hà là nhánh độc lập, nối vào nhờ Trịnh Huy và Lý Hiểu.", "map": "- Kinh thành Đại Hòa: chợ đen, thanh lâu, phủ doãn, Hộ bộ, hoàng cung, hậu cung, quân khố\n- Ngoại thành: kho lương Vương Tài, xưởng đúc lậu, phủ Cao gia hoang\n- Hà Tây (biên Bắc): Thành An Quân, nơi Hoài Lịch và Chu Thâm trấn thủ\n- Hoàng Hà: làng Bá gia, đê, miếu Long Vương\n- Liệt Lao: nhà tù tranh chấp Minh Giáo và Thái Bình Đạo, chỉ đến qua manh mối\n- Nam Quốc (Sở Thành) và Bắc Quốc: chỉ xuất hiện qua thư từ, tiền sắt, sứ thần", "gm": "Hai trục giải mã: trục tiền bạc (chợ đen, thanh lâu, kho lương, Vương Tài) và trục huyết thống ân oán (Lâm Bách, Bách Hải, Cao gia, hậu cung). Hai trục gặp nhau ở Vương Tài và Vương Lộc, hai kẻ giật dây lớn.", "ct": "Gần như mọi án đều có tay của phe Vương Tài (chủ hòa, muốn ngôi, có Nam Quốc hậu thuẫn). Triều đình nát từ thời Phủ Hách nên mọi bi kịch đều bắt nguồn từ sự bỏ mặc trung thần.", "ghi": "Gợi ý độ khó: án tiền giả (dễ, làm quen), Lâm Bách (trung bình), Hoàng Hà (trung bình, nhánh phụ), Cao gia và hậu cung (khó, chốt).", "id": "a0", "vc": "- Nửa mặt dây chuyền (hai nửa: nửa của Lâm An nay ở chỗ Bách Hải, nửa kia Lâm Bách giữ): chứng minh huyết thống, xuất hiện ở án 2 và án 3\n- Mảnh pháp quang: bằng chứng Bách Hải giả cao nhân bằng vật lý, tìm ở phế tích Diệu Vọng Tháp\n- Thanh kiếm Bách Hải trao Lâm An: nhận ra Triệu Lan qua hồ sơ\n- Dấu xăm dưới lòng bàn chân: nhận diện Lâm Quyền", "bd": "Thứ tự mở khóa gợi ý của cả bản đồ:\n- Ngày 1: chợ đen, ngục tạm, thanh lâu, phố phát lương, miếu Long Vương\n- Sau khi xong án tiền giả B3: phủ doãn, Hộ bộ, xưởng đúc lậu\n- Sau Tô Khuyết: kho lương Vương Tài, kho hồ sơ Phủ Hách\n- Sau vi hành: phủ Vương Lộc, đền Thái Bình Đạo, phế tích Diệu Vọng Tháp\n- Cuối cùng: cung điện, hậu cung, chùa Thái Bình Đạo của Yến phi, phủ Cao gia hoang\n- Hà Tây, Liệt Lao, Nam Quốc: chỉ qua thư và hồi ức, không đi được"}, {"name": "1. Án tiền giả: chén Kim Sinh", "tom": "Người chơi dùng loại tiền chợ đen (tên gợi ý: Ám Thị Phiếu) để mua tin và vật phẩm. Đó là tiền nhà nước cấm, cả nhóm bị còng vào ngục (trừ điểm, mất quyền lợi). Quan triều xuất hiện: điều tra chân tướng tiền giả hoặc ở tù. Sự kiện công khai: cống phẩm chén Kim Sinh bị cướp giữa thanh lâu, tiền Phủ Hách tung ra khắp phố.", "nv": "- Chính (quan phủ giao): tìm kẻ cướp chén và nguồn tiền, hạn 7 ngày\n- Phụ (chợ đen): truy nguồn tiền cấm; bảo vệ thương nhân đổi tiền; tra nhóm thu mua tiền Phủ Hách cũ\n- Ẩn: có người nhờ lấy lại một lô tiền sắt Nam Quốc", "npc": "Quan tra án do triều cử; chủ thanh lâu; thương nhân chợ đen; thợ đúc tiền; Hoàng hậu (sau lưng); Vương Tài; Tô Khuyết (ẩn danh); Tôn Luận (cản trở); Trịnh Huy (Hộ bộ).", "map": "", "mm": "Tầng 1 (hiện trường): chén có hai đáy, vết sáp quanh bàn; tiền tuôn ra là tiền Phủ Hách thật, không phải tiền giả.\nTầng 2: tiền Phủ Hách lẫn tiền sắt Nam Quốc; sổ thanh lâu ghi khách quý là người của Vương Tài; thợ đúc khai có người trả vàng thu tiền cũ.\nTầng 3: ký hiệu Sở Thành khắc trên mẻ tiền sắt (Tô Khuyết); thư Hoàng hậu mượn chén; sổ thu hồi tiền có chữ ký Tôn Luận; Trịnh Huy lén mở kho cho dân đói.", "gm": "B1 chợ đen → B2 thanh lâu (chén, sổ khách) → B3 thợ đúc, tiền sắt → B4 tìm ra Tô Khuyết (thuyết phục hoặc bắt) → B5 lần theo kho lương Vương Tài và Tôn Luận → B6 trình kết luận trước triều.", "ct": "Là kế Sinh Kim của Hoàng hậu và Vương Tài, Nam Quốc hậu thuẫn: màn trình diễn chén vàng sinh ra tiền để tung tiền Phủ Hách, ép triều đình ra lệnh thu hồi tiền cũ. Quan lại trục lợi, dân mất của, lương giữ cho quân đội nên đói; kho lương Vương Tài phát lương mua danh, ép dừng chiến tranh với Nam Quốc. Tô Khuyết bị Nam Quốc sai phá kinh tế nhưng đã đổi ý vì dân.", "ghi": "Kết tốt: nhà nước bảo chứng tiền tệ thay vì dùng kim loại, ngưng chiến, lo ấm no. Kết xấu: chỉ bắt thợ đúc, Vương Tài thoát. Phần thưởng: tha tội, chức nhỏ, quyền vào kho hồ sơ.", "id": "a1", "vc": "Tầng 1 (hiện trường):\n- Chén Kim Sinh có hai đáy, còn mùi sáp\n- Mảnh giấy dầu và sáp gần bàn\n- Vài đồng tiền Phủ Hách mới đúc, mép còn nhám (đúng khuôn tiền triều)\nTầng 2 (người liên quan):\n- Sổ khách thanh lâu, trang quý khách bị xé (còn vết mực lộ tên người của Vương Tài)\n- Tiền sắt Nam Quốc lẫn trong tiền Phủ Hách (dùng nam châm thử được)\n- Biên nhận mua vàng của thợ đúc\n- Khuôn tiền cũ trong xưởng đúc lậu\nTầng 3 (bằng chứng quyết định):\n- Mẻ tiền sắt khắc ký hiệu Sở Thành\n- Thư Hoàng hậu hỏi mượn chén\n- Sổ thu hồi tiền có chữ ký và ấn Tôn Luận\n- Biên bản Trịnh Huy mở kho cho dân đói\n- Lệnh bài chợ đen khắc dấu kho lương Vương Tài", "bd": "", "acts": [{"t": "Chợ đen: tiền cấm", "dd": "Chợ đen (hẻm bến)", "ai": "thương nhân tiền cấm, người môi giới", "mk": "ngày 1, mở sẵn", "vc": "Tiền chợ đen (tên gợi ý Ám Thị Phiếu) dùng mua tin và vật phẩm; lời đồn về chén Kim Sinh.", "dt": "Người chơi được giới thiệu loại tiền chợ đen, buôn bán tin tức và vật phẩm. Ai cũng nói về chén vàng sinh tiền sắp xuất hiện ở thanh lâu. Ngay sau đó loại tiền này hóa ra là tiền nhà nước cấm.", "tt": "Màn 2"}, {"t": "Bị bắt và nhận nhiệm vụ", "dd": "Ngục tạm", "ai": "quan tra án", "mk": "sau khi bị bắt", "vc": "Lệnh giao nhiệm vụ của quan tra án.", "dt": "Cả nhóm bị còng vào ngục, bị trừ điểm hoặc quyền lợi. Quan triều xuất hiện và giao việc: điều tra chân tướng tiền giả trong 7 ngày, nếu không thì ở tù. Từ đây các địa điểm khác mới mở.", "tt": "Màn 3"}, {"t": "Thanh lâu: hiện trường chén bị cướp", "dd": "Thanh lâu", "ai": "chủ lầu, ca kỹ chứng kiến", "mk": "sau nhận nhiệm vụ", "vc": "Chén Kim Sinh hai đáy còn mùi sáp; giấy dầu và sáp gần bàn; vài đồng tiền Phủ Hách mới đúc, mép còn nhám; trang quý khách trong sổ bị xé, còn vết mực lộ tên người của Vương Tài.", "dt": "Màn tiền tuôn ra thật ra là trò dàn dựng, tiền giấu ở đáy thứ hai của chén. Muốn xem sổ khách phải thuyết phục chủ lầu hoặc lẻn vào phòng sổ. Tên trên trang bị xé trỏ về người của Vương Tài.", "tt": "Màn 4"}, {"t": "Xưởng đúc lậu: nguồn tiền", "dd": "Xưởng đúc lậu", "ai": "thợ đúc", "mk": "sau khi có sổ khách", "vc": "Khuôn tiền cũ; biên nhận mua vàng; tiền sắt Nam Quốc lẫn trong tiền Phủ Hách (thử bằng nam châm).", "dt": "Thợ đúc khai có người trả vàng thu tiền triều cũ và đúc thêm bằng khuôn cũ. Tiền sắt Nam Quốc lẫn vào cho thấy có tay Nam Quốc.", "tt": "Màn 5"}, {"t": "Phủ doãn: sổ thu hồi tiền", "dd": "Phủ doãn", "ai": "Tôn Luận, thuộc hạ", "mk": "sau biên nhận", "vc": "Sổ thu hồi tiền có chữ ký và ấn Tôn Luận.", "dt": "Tôn Luận cản trở và hạch sách người chơi; cần lệnh quan mới xem được sổ. Sổ cho thấy chính sách thu hồi tiền cũ bị quan lại trục lợi, dân mất của, lương giữ cho quân đội nên kinh thành đói.", "tt": "Màn 6"}, {"t": "Hộ bộ: cánh cửa kho lương", "dd": "Hộ bộ", "ai": "Trịnh Huy", "mk": "sau khi gặp Tôn Luận", "vc": "Biên bản Trịnh Huy mở kho cho dân đói; tờ sớ xin mở kho bị bác.", "dt": "Trịnh Huy thương dân, từng dâng sớ xin mở kho nhưng bất thành. Anh lén cứu dân, về sau bị phe Vương Tài thuyết phục tuồn kho lương bằng tiền của Vương Tài. Được đối đãi tử tế thì anh sẽ khai.", "tt": "Màn 7"}, {"t": "Nhà trọ nghèo: Tô Khuyết", "dd": "Nhà trọ nghèo", "ai": "Tô Khuyết", "mk": "sau thấy ký hiệu Sở Thành", "vc": "Mẻ tiền sắt khắc ký hiệu Sở Thành; lời khai Tô Khuyết; thư Hoàng hậu hỏi mượn chén.", "dt": "Tô Khuyết, cựu chủ Sở Thành, sống ẩn danh giữa dân thường. Nàng nhận lệnh Nam Quốc phá kinh tế Đại Hòa để được về nước nhưng đã đổi ý vì dân lầm than. Người chơi chọn thuyết phục nàng làm chứng hoặc bắt; thuyết phục thì mở thêm manh mối.", "tt": "Màn 8"}, {"t": "Kho lương Vương Tài: chốt án", "dd": "Kho lương Vương Tài", "ai": "lính canh, quản kho", "mk": "sau lời khai Tô Khuyết hoặc Trịnh Huy", "vc": "Lệnh bài chợ đen khắc dấu kho lương Vương Tài; sổ nhập tiền Phủ Hách; kho có lương thật phát cho dân.", "dt": "Kho nhận tiền Phủ Hách để lấy danh tiếng, thật sự phát lương cho dân đói và để họ tung hô Vương Tài cùng bảo vật Nam Quốc. Ghép đủ chứng cứ: Sinh Kim là kế của Hoàng hậu và Vương Tài, ép chính sách tiền tệ để trì hoãn chiến tranh với Nam Quốc. Người chơi trình kết luận trước triều.", "tt": "Kết án: kết tốt (nhà nước bảo chứng tiền tệ, ngưng chiến, lo ấm no) hoặc kết xấu (chỉ bắt thợ đúc, Vương Tài thoát)."}], "ds": "Quan tra án triều đình | giao nhiệm vụ, giám sát hạn 7 ngày, sợ cấp trên | màn 2\nThương nhân chợ đen | bán tiền cấm và tin tức, biết lời đồn chén | màn 1\nChủ thanh lâu | sợ liên lụy, giấu sổ khách quý | màn 3\nThợ đúc tiền | đúc lậu cho người trả vàng, khai khi bị ép | màn 4\nTôn Luận (phủ doãn) | tham nhũng, cản trở, chia tiền với Vương Tài | màn 5\nTrịnh Huy (Hộ bộ) | thương dân, tuồn kho lương cho Vương Tài | màn 6\nTô Khuyết | cựu chủ Sở Thành, nhận lệnh Nam Quốc, đã đổi ý | màn 7\nVương Tài | chủ mưu, kho lương và kế Sinh Kim | màn 8 (qua chứng cứ)\nHoàng hậu | cùng Vương Tài lập kế Sinh Kim, hỏi mượn chén | màn 7 (qua thư)\nNam Quốc | hậu thuẫn Vương Tài, sai Tô Khuyết, dùng tiền sắt | qua tiền sắt", "mv": "[Chính] Tìm kẻ cướp chén và nguồn tiền giả | quan tra án giao | hạn 7 ngày, hoàn thành khi trình đủ chứng cứ trước triều | thưởng: tha tội, chức nhỏ, vào kho hồ sơ; thất bại: ở tù\n[Phụ] Truy nguồn tiền cấm ở chợ đen | thương nhân chợ đen nhờ | tìm ra người thu mua tiền cũ | thưởng: tin tức, vật phẩm\n[Phụ] Bảo vệ thương nhân đổi tiền khỏi quan lại trục lợi | dân nhờ | thương nhân an toàn qua màn phủ doãn | thưởng: lòng dân\n[Ẩn] Lấy lại lô tiền sắt cho người lạ nhờ (Nam Quốc) | người lạ giao | giao cho Tô Khuyết hoặc nộp triều | hậu quả: mở thêm manh mối hoặc bị nghi\n[Theo vai] Quan: lập công; hiệp khách: được ân xá; thương nhân: giữ mối làm ăn"}, {"name": "2. Án Lâm Bách và tin đồn cầu trường sinh", "tom": "Ở địa phương, Lâm Bách tập hợp vài quan tiền triều và quan địa phương chống tân đế. Tin đồn đế cầu trường sinh lan ra. Đế vi hành, nghe tin, điều tra thân phận Lâm Bách, mở lại liên hoàn án Bách Hải năm xưa.", "nv": "- Dân và quan địa phương: tìm nguồn tin đồn; bảo vệ kho phát lương\n- Hoàng thất, đế vi hành: tuyến 1 điều tra gốc gác Lâm Bách và Bách Hải; tuyến 2 điều tra kẻ giật dây\n- Ẩn: nhận ra nửa mặt dây chuyền", "npc": "Lâm Bách; Đế (ẩn danh); chủ Thượng gia và sư gia; Vương Lộc; Trần phi (qua thư); quan địa phương; dân nhận lương; tàn dư Thái Bình Đạo; Bách Hải (qua hồ sơ).", "map": "", "mm": "Tầng 1: người rao tin là thuộc hạ Thượng gia; nét chữ sấm trường sinh giống sư gia Thượng gia; sổ phát lương của Lâm Bách sạch.\nTầng 2: thư vu oan kèm nửa mặt dây chuyền giả; hồ sơ cho thấy Lâm Bách thật là con Bách Hải nhưng chuyện thù hận là bịa.\nTầng 3: Thượng gia nhận bạc từ người của Vương Lộc; thư tay Trần phi bảo đẩy tội sang Lâm Bách.", "gm": "Tuyến 1: hồ sơ Phủ Hách → Liệt Lao → nhân chứng lễ tẩy tội → hiểu Lâm Bách muốn gì. Tuyến 2: truy tin đồn → Thượng gia → Vương Lộc, Trần phi. Hai tuyến gặp nhau: Lâm Bách vô tội, chỉ muốn tìm chân tướng cái chết của mẹ.", "ct": "Thượng gia đầu cơ tích lương nên ghét Lâm Bách (phát lương làm tụt giá) và nhận vu oan. Ba mục đích đứng sau: (1) đàn áp Lâm Bách sẽ khiến dân phẫn nộ, bất lợi tân đế; (2) Vương Lộc muốn làm anh hùng diệt Lâm Bách (vì y phản chiến); (3) bôi nhọ đế bằng tin trường sinh, đổ lên Lâm Bách.", "ghi": "Đàn áp: dân loạn. Minh oan: đế hiểu lòng dân, mở backstory Bách Hải cho người chơi chọn tha hay xử. Nhánh vi hành kết nối kết có hậu cho án tiền giả.", "id": "a2", "vc": "Tầng 1:\n- Tờ sấm trường sinh dán ở trà quán (nét chữ của sư gia Thượng gia)\n- Sổ phát lương của Lâm Bách (sạch, từng khoản đối chiếu được)\n- Người rao tin bị bắt, là thuộc hạ Thượng gia\nTầng 2:\n- Thư vu oan kèm nửa mặt dây chuyền giả (ngọc khác vân)\n- Hồ sơ Liệt Lao do cai ngục cũ giữ\n- Biên bản lễ tẩy tội năm xưa\nTầng 3:\n- Ngân phiếu Thượng gia nhận từ phủ Vương Lộc\n- Thư tay Trần phi có ấn riêng, bảo đẩy tội sang Lâm Bách\n- Mảnh pháp quang ở phế tích Diệu Vọng Tháp", "bd": "", "acts": [{"t": "Phố phát lương: Lâm Bách", "dd": "Phố phát lương", "ai": "Lâm Bách, dân nhận lương", "mk": "ngày 1", "vc": "Sổ phát lương của Lâm Bách, đối chiếu từng khoản đều sạch.", "dt": "Lâm Bách làm từ thiện, phát lương, được dân tin. Quan địa phương và dân nhờ người chơi bảo vệ kho phát lương. Người chơi thấy ông không tư túi, mâu thuẫn với tin đồn.", "tt": "Màn 2"}, {"t": "Trà quán: nguồn tin đồn", "dd": "Trà quán", "ai": "người rao tin đồn", "mk": "ngày 1", "vc": "Tờ sấm trường sinh dán ở quán; người rao tin bị bắt, là thuộc hạ Thượng gia.", "dt": "Tin đế cầu trường sinh lan từ đây. Bắt người rao tin, hắn khai theo lệnh sư gia Thượng gia.", "tt": "Màn 3"}, {"t": "Kho lương Thượng gia", "dd": "Kho lương Thượng gia", "ai": "quản sự, sư gia", "mk": "sau lời khai", "vc": "Sổ đầu cơ tích lương; nét chữ sư gia khớp tờ sấm.", "dt": "Thượng gia tích lương trục lợi từ chiến tranh. Lâm Bách phát lương làm giá lương tụt nên Thượng gia ghét và vu oan. Người chơi chứng minh tờ sấm do sư gia viết.", "tt": "Màn 4"}, {"t": "Kho hồ sơ Phủ Hách: tuyến 1", "dd": "Kho hồ sơ Phủ Hách", "ai": "thư lại già", "mk": "sau khi đế hỏi về Lâm Bách", "vc": "Hồ sơ Liệt Lao do cai ngục cũ giữ; biên bản lễ tẩy tội năm xưa.", "dt": "Đế vi hành hỏi về Lâm Bách, mở lại hồ sơ cũ. Hồ sơ cho thấy Lâm Bách là con Bách Hải, nhưng không có bằng chứng ông thù hận hay muốn binh biến.", "tt": "Màn 5"}, {"t": "Đền Thái Bình Đạo: lễ tẩy tội", "dd": "Đền Thái Bình Đạo bỏ hoang", "ai": "tàn dư tín đồ", "mk": "sau hồ sơ", "vc": "Lời kể của tàn dư tín đồ; dấu xăm Lâm Quyền.", "dt": "Tín đồ cũ kể Lâm Thu nhận ra Bách Hải là Lâm Quyền ở lễ tẩy tội rồi bệnh mất. Người chơi hiểu động cơ thật của Lâm Bách là tìm chân tướng cái chết của mẹ.", "tt": "Màn 6"}, {"t": "Phủ Vương Lộc: kẻ giật dây", "dd": "Phủ Vương Lộc", "ai": "gia nhân", "mk": "sau ngân phiếu", "vc": "Ngân phiếu Thượng gia nhận từ phủ Vương Lộc; thư tay Trần phi bảo đẩy tội sang Lâm Bách.", "dt": "Phải lẻn vào hoặc có lệnh. Thư và ngân phiếu nối Thượng gia với Vương Lộc và Trần phi: bôi nhọ đế, kích dân phẫn nộ, Vương Lộc thành anh hùng.", "tt": "Màn 7"}, {"t": "Diệu Vọng Tháp: dấu vết Bách Hải", "dd": "Phế tích Diệu Vọng Tháp", "ai": "không có ai", "mk": "sau tuyến 1", "vc": "Mảnh pháp quang.", "dt": "Phế tích còn mảnh pháp quang cho thấy Bách Hải giả cao nhân bằng hiện tượng vật lý. Hai tuyến gặp nhau: Lâm Bách vô tội.", "tt": "Kết nhánh: minh oan (đế hiểu lòng dân, mở backstory Bách Hải) hoặc đàn áp (dân phẫn nộ)."}], "ds": "Lâm Bách | được dân tin nhờ phát lương, thật ra chỉ muốn tìm chân tướng cái chết của mẹ, là con Bách Hải | màn 1, 4, 5\nĐế (ẩn danh vi hành) | nghe tin đồn, tìm hiểu lòng dân | màn 4\nChủ Thượng gia và sư gia | đầu cơ tích lương, vu oan Lâm Bách | màn 2, 3\nNgười rao tin | thuộc hạ Thượng gia | màn 2\nVương Lộc | muốn làm anh hùng diệt Lâm Bách | màn 6\nTrần phi | giật dây qua thư | màn 6\nQuan địa phương | đứng cùng Lâm Bách, có người muốn chống tân đế | màn 1\nThư lại già | giữ hồ sơ Phủ Hách | màn 4\nTàn dư tín đồ Thái Bình Đạo | nhân chứng lễ tẩy tội | màn 5\nBách Hải | qua hồ sơ và pháp quang | màn 4, 7", "mv": "[Chính, dân và quan địa phương] Tìm nguồn tin đồn đế cầu trường sinh | quan địa phương giao | lần ra Thượng gia | thưởng: danh vọng\n[Phụ] Bảo vệ kho phát lương của Lâm Bách | dân nhờ | không để kho bị đốt hay cướp | thưởng: tín nhiệm\n[Chính, hoàng thất] Tuyến 1: điều tra gốc gác Lâm Bách và Bách Hải | đế vi hành giao | tìm ra lễ tẩy tội và pháp quang | kết quả: Lâm Bách vô tội\n[Chính, hoàng thất] Tuyến 2: tìm kẻ giật dây | đế vi hành giao | có ngân phiếu và thư Trần phi | kết quả: lộ Vương Lộc và Trần phi\n[Ẩn] Nhận ra nửa mặt dây chuyền giả | tự phát hiện | so với dây chuyền thật | mở thêm đoạn hồ sơ"}, {"name": "3. Án Cao gia và yến tiệc thích khách", "tom": "Giang hồ đồn trong cung có bảo vật, cấm quân bị mua chuộc, có ma. Triều đình tương kế tựu kế mở yến tiệc, ai vượt lính canh vào được thì chia bảo vật, để kẻ chủ mưu lộ mặt. Thích khách thật hiện ra: Cao Trạch.", "nv": "- Triều đình: giữ yến tiệc, bắt thích khách\n- Hiệp khách: đột nhập lấy thưởng, nhận ân xá nếu quy phục\n- Quan: lục án cũ Cao gia\n- Hoàng tử: bảo vệ đế hoặc theo Vương Tài", "npc": "Đế (Vương Việt); Cao Trạch; Hàn Huân; Thẩm gia; Cao nhị gia và Cao tam (qua hồ sơ); Diệp Phong (quan văn tiền triều); Trịnh Huy; cấm quân.", "map": "", "mm": "Tầng 1: tin ma là do bọn đầu xỏ bày; không có bảo vật nào trong sổ kho.\nTầng 2: mật chỉ Phủ Hách Đế dặn Cao gia tích lương nuôi quân; chứng cứ phản tặc là nét chữ giả của Hàn Huân.\nTầng 3: Cao nhị gia bán anh trai; Thẩm gia ký tố cáo; thư báo tin của con gái Cao gia gả Chu Thâm.", "gm": "Tuyến 1 hồ sơ tiền triều → tuyến 2 gia nhân, nhân chứng → tuyến 3 hậu cung (xem án 4). Xong hai tuyến thì có đủ chân tướng để khuyên Cao Trạch.", "ct": "Cao gia từng trung nghĩa; Phủ Hách Đế dặn tích lương, nuôi quân vì nghi binh biến lan tới kinh. Khi Vương Việt đánh vào, Hàn Huân gài người, diệt Cao gia và ngụy tạo tội để chính danh thanh trừng; Thẩm gia và Cao nhị gia đồng lõa. Cao Trạch bị Vương Tài lợi dụng. Cao gia cũng có kẻ bại hoại thật (Cao tam tư thông phi tần).", "ghi": "TH1: đế không phòng bị, chết. TH2: đế dùng thế thân, sống; sau đó trò chuyện với Diệp Phong, quan văn tiền triều quy phục. TH3: mai phục, thích khách chết tại chỗ. Biết chân tướng và khuyên Cao Trạch thì đế sống; tìm ra chân tướng hậu cung (phần 3) có thể khiến Cao Trạch phát điên.", "id": "a3", "vc": "Tầng 1:\n- Sổ quân khố không ghi bảo vật nào\n- Truyền đơn tin ma phát ở quán rượu\n- Lệnh bài cấm quân bị mua chuộc\nTầng 2:\n- Mật chỉ Phủ Hách Đế dặn Cao gia tích lương (có ấn riêng của đế)\n- Thư tố cáo phản tặc nét chữ giống Hàn Huân\n- Sổ lương Cao gia có dấu giám sát của đế\nTầng 3:\n- Thư mật giữa Cao nhị gia và Hàn Huân\n- Bản tố cáo có tên Thẩm gia\n- Thư báo tin của con gái Cao gia gả Chu Thâm", "bd": "", "acts": [{"t": "Quân khố: tin đồn bảo vật", "dd": "Quân khố", "ai": "quản kho", "mk": "ngày 1", "vc": "Sổ quân khố không ghi bảo vật; truyền đơn tin ma; lệnh bài cấm quân bị mua chuộc.", "dt": "Giang hồ đồn trong cung có bảo vật, cấm quân bị mua, ma quấy phá. Người chơi nhận ra tin do đầu xỏ bày để gây nhiễu phòng vệ, và triều đình lên kế hoạch mở yến tiệc làm mồi.", "tt": "Màn 2"}, {"t": "Phủ Cao gia hoang", "dd": "Phủ Cao gia hoang", "ai": "vài gia nhân cũ", "mk": "sau sổ lương", "vc": "Mật chỉ Phủ Hách Đế dặn Cao gia tích lương (ấn riêng của đế); sổ lương Cao gia có dấu giám sát của đế; thư tố cáo phản tặc nét chữ giống Hàn Huân.", "dt": "Gia nhân cũ chỉ hầm giấu mật chỉ. Chứng cứ cho thấy Cao gia tích lương theo lệnh vua, không phản; tội trạng bị ngụy tạo.", "tt": "Màn 3"}, {"t": "Nghĩa trang Cao gia", "dd": "Nghĩa trang Cao gia", "ai": "người giữ mộ", "mk": "sau mật chỉ", "vc": "Thư mật Cao nhị gia và Hàn Huân; thư báo tin của con gái Cao gia gả Chu Thâm.", "dt": "Người giữ mộ đưa thư. Cao nhị gia thương con gái nên bán anh trai cho Hàn Huân. Triều đình năm xưa lạnh lẽo, bỏ mặc trung thần ngoài biên ải.", "tt": "Màn 4"}, {"t": "Phủ Thẩm gia", "dd": "Phủ Thẩm gia", "ai": "chủ Thẩm gia", "mk": "sau bản tố cáo", "vc": "Bản tố cáo có tên Thẩm gia; biên nhận bạc từ Hàn Huân.", "dt": "Thẩm gia, quan văn Phủ Hách, phản tiền triều theo Vương Việt, cấu kết Hàn Huân bán đứng Cao gia (vốn là đối thủ cũ).", "tt": "Màn 5"}, {"t": "Sảnh yến tiệc: thích khách lộ mặt", "dd": "Sảnh yến tiệc", "ai": "cấm quân, khách", "mk": "ngày yến", "vc": "Vũ khí giấu của thích khách; thân phận Cao Trạch, con Cao gia chủ.", "dt": "Vài đại hiệp lẻn vào được và nhận ân xá nếu quy phục. Thích khách thật lộ diện, chém Hàn Huân: đó là Cao Trạch, nuôi hận gia tộc và bị Vương Tài lợi dụng. Người chơi dùng chân tướng để khuyên Cao Trạch; nếu chưa đủ chứng cứ, đế có thể chết (TH1), dùng thế thân (TH2) hoặc mai phục khiến thích khách chết tại chỗ (TH3). Nếu có tuyến hậu cung (án 4) thì dùng nó để phá lời Cao Trạch.", "tt": "Màn 6"}, {"t": "Điện riêng: Diệp Phong quy phục", "dd": "Điện riêng", "ai": "Đế, Diệp Phong", "mk": "khi thích khách bị khống chế (TH2)", "vc": "Lời Diệp Phong; ân xá và châu báu cho hiệp khách quy phục.", "dt": "TH2: khống chế thích khách xong, đế vào điện riêng trò chuyện với Diệp Phong, quan văn tiền triều chọn quy phục. Các hiệp khách quy phục được ban châu báu và ân xá, phục vụ dân.", "tt": "Kết: xem phần Kết cục và lựa chọn."}], "ds": "Cao Trạch | thích khách, con Cao gia chủ, hận gia tộc, bị Vương Tài lợi dụng | màn 5\nHàn Huân | diệt Cao gia, ngụy tạo chứng cứ, bị chém ở yến tiệc | màn 2, 5\nCao nhị gia | bán anh trai cho Hàn Huân vì thương con gái | màn 3 (qua thư)\nCao tam | tư thông phi tần tiền triều | qua hồ sơ\nThẩm gia | quan văn Phủ Hách, cấu kết Hàn Huân | màn 4\nDiệp Phong | quan văn tiền triều, quy phục theo đế ở TH2 | màn 6\nĐế (Vương Việt) | mục tiêu thích khách; có thể chết, dùng thế thân hoặc mai phục | màn 5, 6\nCấm quân | bị đồn mua chuộc | màn 1\nGia nhân Cao gia cũ, người giữ mộ | chỉ chỗ giấu chứng cứ | màn 2, 3\nCon gái Cao gia gả Chu Thâm | báo tin về mà triều đình thờ ơ | màn 3 (qua thư)", "mv": "[Chính, triều đình] Giữ yến tiệc và bắt thích khách | đế giao | thích khách bị bắt hoặc được khuyên | thất bại: đế có thể chết\n[Chính, hiệp khách] Đột nhập yến tiệc lấy phần thưởng | tin đồn giang hồ | vượt lính canh | thưởng: châu báu, ân xá nếu quy phục Đại Hòa\n[Chính, quan] Lục án cũ Cao gia | triều giao | có mật chỉ, thư Cao nhị gia, bản tố cáo Thẩm gia | kết quả: chân tướng Cao gia\n[Phụ, hoàng tử] Bảo vệ đế hoặc theo Vương Tài | tự chọn | theo phe nào thì có kết cục đó\n[Ẩn] Khuyên Cao Trạch quay đầu | tự quyết | có chân tướng hai tuyến (và hậu cung) | thưởng: đế sống"}, {"id": "a4", "name": "4. Án hậu cung: cung nhân chết, ma nữ", "tom": "Hậu cung Đại Hòa xảy ra chuyện lạ: cung nhân mất tích, đêm đến vang tiếng khóc và có người thấy ma nữ. Người đứng ra điều phối vụ án chỉ có Hoàng hậu, và bà có thể giao việc cho phi tần, công chúa hoặc hoàng tử đang ở trong cung. Người chơi lần theo dấu vết từ một cung nhân biến mất, đến hai thi thể trong giếng cạn, rồi tới một vụ án cũ bị chôn từ thời Phủ Hách. Cuối cùng họ sẽ biết đây không phải ma quỷ mà là một màn dàn dựng của Yến phi theo ý Cao Trạch, và qua đó phát hiện Cao gia đang oán tân triều, nội bộ Cao gia có người bại hoại.", "ct": "1. Quá khứ (thời Phủ Hách). Cao gia không có con gái nên nhận biểu cô nương Yến làm con gái, đưa vào cung Phủ Hách. Yến và Cao tam yêu nhau từ nhỏ nhưng bị chia cắt vì nàng phải vào cung, về sau hai người tư thông. Yến phi khi ấy quản hậu cung. Cung nhân Mai biết chuyện nên bị nàng giết, xác giấu trong giếng cạn ở khu lãnh cung cũ và người ta đồn là ma ám. Lúc đó đang loạn Bách Hải, triều đình mục rỗng nên không ai tra.\n\n2. Chuyển triều. Vương Việt binh biến thành công, Cao gia bị Hàn Huân diệt và bị gán tội phản tặc. Yến phi bỏ rơi Cao tam để giữ mình, còn góp phần thổi lửa cho bi kịch Cao gia để che giấu chuyện xấu của mình. Nàng lui lên tu ở một chùa của Thái Bình Đạo (giáo phái từng gây loạn thời Bách Hải), nhờ mạng lưới tín đồ mà tai mắt cũ vẫn còn trong cung. Khi Cao tam chết, nàng day dứt và sinh hận tân triều. Chùa nơi nàng tu thuộc Thái Bình Đạo, giáo phái từng bị triều đình kiềm hãm sau binh biến Bách Hải, nên tín đồ có lý do không ưa tân triều, sẵn lòng che chở và chuyển thư cho nàng.\n\n3. Hậu cung tân triều. Trần phi từng sảy thai, đế dung túng bao che cho người của Yến phi (gợi ý lý do: để yên lòng cựu thần tiền triều), khiến Trần phi yêu quá hóa hận. Hoàng hậu thì đang hẹn hò Vương Lộc trong hoa viên và không muốn ai đi lại ban đêm.\n\n4. Kế hoạch. Cao Trạch muốn xiên đế nên nhờ Yến phi. Yến phi đồng ý vì cũng muốn trả thù cho tình cũ. Nàng sai Tào ma ma (cựu thuộc hạ, quản phòng giặt) dựng lại án ma năm xưa để làm nhiễu phòng vệ hậu cung và khiến Hoàng hậu, phi tần đấu đá nhau, tạo đường cho thích khách ở yến tiệc (án 3).\n\n5. Điều thực sự đã xảy ra. Vài cung nhân mất tích đầu tiên chỉ bỏ trốn vì sợ ma, đóng vai mồi nhử. Người chết thật là A Trúc, cung nhân của Lan phi: cô thấy Tào ma ma nhận thư từ chùa Thái Bình Đạo ở cửa Tây nên bị giết, xác bỏ xuống giếng cũ, giỏ đồ ném xuống ao sen. Tiếng khóc ma là gió thổi qua ống tre nối thủy đạo cũ, bóng ma mặc vải thô trắng của tín đồ Thái Bình Đạo.\n\n6. Nghi phạm giả. Trần phi (có thù nhưng chỉ lợi dụng), Lan phi (bên bị hại), Hoàng hậu (cản trở vì bí mật tình riêng) đều có lý do khiến người chơi nghi ngờ.", "npc": "Bên gây án: Yến phi (biểu cô nương Cao gia, từng quản hậu cung Phủ Hách, nay tu ở chùa Thái Bình Đạo); Tào ma ma (cựu thuộc hạ, quản phòng giặt, trực tiếp ra tay); thị vệ Trương (gác cửa Tây, bị mua chuộc); Cao Trạch (chủ mưu, chỉ xuất hiện qua thư).\n\nBên bị hại: A Trúc (cung nhân Lan phi, nạn nhân mới); Mai (cung nhân Phủ Hách, hài cốt cũ); Lan phi (nghĩa nữ của quan tiền triều, ngầm muốn báo thù cho nghĩa phụ, nghĩa mẫu).\n\nBên điều tra: Hoàng hậu (điều phối); phi tần, công chúa, hoàng tử và OC được giao việc.\n\nNhân chứng: bà Lưu (cung nhân già biết án cũ); Tiểu Lục (cung nữ nhỏ thấy ma); chủ quán ngoài cung; thư lại Nội vụ phủ.\n\nNghi phạm giả: Trần phi (đối thủ Hoàng hậu, bốc đồng, thật lòng yêu đế nhưng đã hóa hận); Hoàng hậu (cản trở vì hẹn hò Vương Lộc); Lan phi.", "acts": [{"t": "Tin đồn trong hậu cung", "dd": "Phòng giặt, phòng quét dọn", "ai": "Cung nhân, Tào ma ma", "mk": "Mở sẵn từ đầu", "vc": "Chưa có vật chứng. Chỉ có lời kể rời rạc: vài cung nhân biến mất, ai cũng nói đã thấy ma.", "dt": "Hoàng hậu nói đang điều tra nhưng thực chất không làm gì. Người chơi nghe tin đồn, thấy Tào ma ma rất sốt sắng giúp đỡ. Thật ra những người mất tích đầu tiên chỉ bỏ trốn vì sợ ma (mồi nhử), nhưng chưa ai biết.", "tt": "Màn 2 khi một cung nhân đi xuất cung mà không về."}, {"t": "Cáo trạng của Lan phi", "dd": "Cung Lan phi, cung Hoàng hậu", "ai": "Lan phi, Trần phi, Hoàng hậu", "mk": "Xảy ra sau ngày xuất cung hằng tháng", "vc": "Lời cáo trạng của Lan phi; thái độ của Trần phi và Hoàng hậu.", "dt": "Mỗi tháng cung nhân phi tần được xuất cung một lần mua đồ. A Trúc của Lan phi đi mà không về, Lan phi cáo trạng lên Hoàng hậu. Trần phi thừa cơ ép Hoàng hậu trước đế và triều thần. Hoàng hậu bị buộc phải điều tra thật, giao việc cho người chơi.", "tt": "Màn 3: kiểm tra đường A Trúc đã đi."}, {"t": "Dấu vết ngoài cung", "dd": "Cửa Tây, quán mua đồ ngoài cung", "ai": "Thị vệ Trương, chủ quán", "mk": "Cần lệnh điều tra của Hoàng hậu", "vc": "Sổ xuất cung ghi A Trúc ra nhưng không ghi vào, chỗ ghi vào bị sửa mực. Chủ quán xác nhận A Trúc mua hai gói hương liệu rồi về trước giờ Mùi.", "dt": "Hai nguồn trái nhau: sổ nói cô chưa về, chủ quán nói cô đã về. Người chơi suy ra A Trúc đã quay lại cung, nghĩa là cô chết bên trong. Thị vệ Trương sợ hãi, chỉ khai khi bị đối chiếu hoặc áp lực.", "tt": "Màn 4: tìm dấu vết trong cung."}, {"t": "Giỏ đồ dưới ao sen", "dd": "Hoa viên (ban ngày), ao sen", "ai": "Cung nhân dọn vườn", "mk": "Sau khi biết A Trúc đã vào lại cung", "vc": "Giỏ đồ mua của A Trúc có hai gói hương liệu. Cùng chỗ có một ống tre dài buộc dây gai.", "dt": "Người chơi lần theo đường về cung của A Trúc và tìm thấy giỏ đồ bị ném dưới ao. Vết bùn và rêu kéo dài về phía khu lãnh cung cũ.", "tt": "Màn 5: tìm tới giếng cạn."}, {"t": "Giếng cạn: hai thi thể", "dd": "Khu lãnh cung cũ, giếng cạn", "ai": "Không có ai canh", "mk": "Sau khi có giỏ đồ và vết kéo", "vc": "Xác A Trúc mới chết, tay nắm mảnh vải thô trắng. Dưới đáy còn hài cốt cũ cùng cây trâm kiểu Phủ Hách.", "dt": "Phát hiện hai nạn nhân thuộc hai thời khác nhau. Vụ án mới gắn với một án cũ bị bỏ quên. Tin này lan nhanh, làm hậu cung xôn xao và đẩy Hoàng hậu vào thế khó.", "tt": "Màn 6 (đêm) và Màn 7 (án cũ), có thể làm song song."}, {"t": "Đêm hoa viên: ma nữ", "dd": "Hoa viên, đình, ao sen (đêm 2)", "ai": "Tiểu Lục, bóng áo trắng, tình cờ gặp Hoàng hậu và Vương Lộc", "mk": "Ban đêm sau khi tìm ra xác", "vc": "Tiếng khóc phát ra từ ống tre nối thủy đạo cũ, gió thổi mới kêu. Mảnh vải thô trắng cùng loại với mảnh trong tay A Trúc. Có mùi hương chùa Thái Bình Đạo.", "dt": "Tiểu Lục kể thấy ma nữ khóc ở hoa viên. Người chơi canh đêm thấy bóng áo trắng nhưng nó trốn đi. Có thể vô tình bắt gặp Hoàng hậu hẹn hò Vương Lộc, đó là lý do bà không muốn ai tra đêm. Đây là hint ẩn của một vai.", "tt": "Màn 8 và Màn 9 khi có vải trắng và hương chùa Thái Bình Đạo."}, {"t": "Lật lại án cũ", "dd": "Nội vụ phủ, chỗ ở bà Lưu", "ai": "Thư lại Nội vụ phủ, bà Lưu", "mk": "Sau khi có hài cốt cũ ở Màn 5", "vc": "Hồ sơ án cũ bị xé mất trang. Biên lai cấp phát ghi tên Mai khớp với cây trâm.", "dt": "Bà Lưu nhớ cung nhân Mai biến mất mười mấy năm trước, khi Yến phi quản hậu cung, lúc ấy cũng đồn có ma. Người chơi nhận ra đây là cách dựng lại án năm xưa và có người rất rành án cũ.", "tt": "Màn 8 và Màn 9."}, {"t": "Nhiễu loạn và loại trừ nghi phạm giả", "dd": "Cung Trần phi, cung Lan phi, cung Hoàng hậu", "ai": "Trần phi, Lan phi, Hoàng hậu", "mk": "Sau khi có đủ manh mối từ Màn 5 đến Màn 7", "vc": "Không có vật chứng mới. Cần đối chiếu: vải trắng chỉ tín đồ Thái Bình Đạo dùng, hương chùa Thái Bình Đạo, thời gian có mặt của từng người.", "dt": "Trần phi bị nghi vì thù Lan phi và Hoàng hậu. Hoàng hậu đẩy tội cho Trần phi để khép án. Lan phi nghi Trần phi. Người chơi dùng vải và hương chùa Thái Bình Đạo để chứng minh cả ba đều không phải thủ phạm.", "tt": "Màn 9 khi nghi phạm giả bị loại."}, {"t": "Truy dấu về chùa Thái Bình Đạo", "dd": "Phòng giặt, chùa Thái Bình Đạo ngoài thành", "ai": "Tào ma ma", "mk": "Sau khi loại trừ nghi phạm giả", "vc": "Tín vật Cao tam (túi thơm hoặc ngọc bội có chữ Cao) trong tay nải Tào ma ma. Thư của chùa Thái Bình Đạo nhắn: hậu cung loạn thì yến tiệc dễ vào.", "dt": "Dựa vào vải trắng, hương chùa Thái Bình Đạo và sổ cửa Tây, người chơi bắt Tào ma ma. Bà không khai nhưng tay nải lộ tín vật và thư. Lá thư liên hệ thẳng với án 3 (yến tiệc, Cao Trạch).", "tt": "Màn 10: đối chất tại chùa Thái Bình Đạo."}, {"t": "Đối chất Yến phi", "dd": "Chùa Thái Bình Đạo ngoài thành", "ai": "Yến phi", "mk": "Sau khi có tín vật Cao tam, thư chùa Thái Bình Đạo và trâm Mai", "vc": "Lời khai của Yến phi. Hint ẩn về Cao gia: Cao nhị gia bán anh cho Hàn Huân, Cao tam tư thông phi tần tiền triều.", "dt": "Đây là chùa của Thái Bình Đạo nên tín đồ canh giữ và che chở Yến phi; người chơi phải đối chất khéo, tránh động tới cả giáo phái. Yến phi chối rồi nhận từng phần khi bị đưa bằng chứng. Nàng thừa nhận án cũ, giữ im lặng về kế hoạch thích khách. Cuối cùng hé lộ một phần oán hận và quá khứ của Cao gia và đưa hint ẩn.", "tt": "Nối sang án 3: Cao gia và thích khách ở yến tiệc."}], "ghi": "Kết cục tốt nhất: bắt Tào ma ma, đối chất Yến phi, nhận hint ẩn và thư nhắc yến tiệc. Nhờ đó nối sang án 3, Cao Trạch bị lộ và đế sống.\n\nKết cục trung bình: chỉ bắt Tào ma ma, Yến phi thoát, Cao Trạch vào yến tiệc mà không bị lộ.\n\nKết cục đen tối: Hoàng hậu đổ tội cho Trần phi, Trần phi bị phế rồi thành đồng minh của Cao Trạch.\n\nNhánh Lan phi: nếu được giúp, nàng lộ thân phận nghĩa nữ và đứng về phe người chơi hoặc phe báo thù.\n\nHint ẩn gợi ý chia vai: hoàng tử X say rượu thấy Hoàng hậu và thân vương hò hẹn; công chúa nghe tiếng khóc đúng một giờ nhất định; phi tần Y nhận ra loại vải; OC giữ sổ chi tiêu của chùa Thái Bình Đạo. Các hoàng tử đấu nhau: ai được thương, ai bị ghét, xuất thân mẹ ruột. Có mạch hợp lý thì có thể phò Vương Tài lên ngôi, không thì bị điều tra rồi chết.", "nv": "", "map": "", "bd": "", "mm": "", "vc": "", "gm": "", "kb": "", "ds": "Hoàng hậu | điều phối, cản trở vì hẹn hò Vương Lộc | màn 2, 6, 8\nYến phi | chủ mưu án mới, giữ hint ẩn Cao gia | màn 10\nTào ma ma | tay chân, ra tay giết A Trúc, quản phòng giặt | màn 1, 9\nThị vệ Trương | gác cửa Tây, bị mua chuộc | màn 3\nA Trúc | cung nhân Lan phi, nạn nhân mới | màn 2, 5\nMai | cung nhân Phủ Hách, hài cốt cũ | màn 5, 7\nLan phi | nghĩa nữ quan tiền triều, đứng ra cáo trạng | màn 2, 8\nTrần phi | ép Hoàng hậu, bị nghi và bị lợi dụng | màn 2, 8\nBà Lưu | nhân chứng án cũ | màn 7\nTiểu Lục | cung nữ nhỏ thấy ma nữ | màn 6\nCao Trạch | chủ mưu xa, nhờ Yến phi | qua thư", "mv": "[Chính, Hoàng hậu giao] Tra vụ cung nhân A Trúc mất tích | giao cho phi tần, công chúa, hoàng tử | tìm ra hung thủ thật | thưởng: ân sủng, mở hint ẩn; thất bại: bị điều tra, có thể chết\n[Phụ] Tìm cung nhân cũ còn sống | bà Lưu | có lời khai về án năm xưa | thưởng: manh mối án cũ\n[Phụ] Canh đêm hoa viên | Tiểu Lục nhờ | thấy bóng ma và ống tre | thưởng: vải trắng, hương chùa Thái Bình Đạo\n[Phụ] Kiểm tra sổ cửa Tây | Hoàng hậu cấp lệnh | phát hiện sửa mực | thưởng: hướng điều tra\n[Ẩn] Truy hướng thư giữa chùa Thái Bình Đạo và hậu cung | tự phát hiện | có thư chùa Thái Bình Đạo và tín vật Cao tam | thưởng: nối sang án 3\n[Theo vai] Lan phi: đòi công đạo cho A Trúc; Trần phi: lợi dụng án; Hoàng hậu: giữ yên hậu cung"}, {"name": "5. Án Hoàng Hà: Bá gia và thần cá", "tom": "Dân Hoàng Hà thờ Long Vương, không tin thuốc, không đắp đê. Mỗi năm Bá gia thỉnh Long Vương từ sông lên cầu qua mùa lũ. Đê vỡ, lũ tăng, được gọi là thần cá hiển linh.", "nv": "- Điều tra vì sao đê hỏng\n- Bảo vệ dân khỏi mùa lũ\n- Ẩn: tìm hồ sơ Lý Hiểu", "npc": "Trần Tiêu (mưu sĩ của Bách Hải, nay là kẻ đứng sau); gia chủ Bá gia; dân làng; Lý Hiểu và Bá Vinh (qua hồ sơ).", "map": "", "mm": "Tầng 1: cá chép trong miếu là cá thường, mỗi đời bị giết thay mới.\nTầng 2: sổ chi tiền đê, đê làm sơ sài.\nTầng 3: thư của Trần Tiêu; ghi chép của Lý Hiểu.", "gm": "Cá chép → miếu → sổ đắp đê → đê dởm → Trần Tiêu → hồ sơ Lý Hiểu.", "ct": "Bá gia chỉ thờ một con cá chép thường để biểu trưng luân hồi. Bách Hải từng dùng cách này thu phục lòng người, nay Trần Tiêu dùng lại để bòn tiền đắp đê, làm đê dởm, lũ tăng rồi gọi là thần cá hiển linh. Backstory: Lý Hiểu cưới Bá Vinh, làm y thuật và đẩy lùi mê tín; triều đình không đáp tiếng kêu khi thiên tai trùng binh biến; bản thật bà tư thông Vương Tài, để Bá Vinh chết đói rồi giả chết trở về.", "ghi": "Nối vào án chính: Trịnh Huy là học trò Lý Hiểu, hắc hóa sau cái chết của sư phụ rồi tuồn kho lương cho Vương Tài.", "id": "a5", "vc": "Tầng 1:\n- Cá chép trong miếu (cá thường, vừa thay mới)\n- Vảy cá lẫn bùn đê\nTầng 2:\n- Sổ chi tiền đắp đê (số tiền lớn, đê sơ sài)\n- Đoạn đê làm bằng gỗ mục trộn đất\nTầng 3:\n- Thư của Trần Tiêu\n- Nhật ký Lý Hiểu (nhắc thư tình với Vương Tài)", "bd": "", "acts": [{"t": "Làng Bá gia: tục lệ", "dd": "Làng Bá gia", "ai": "gia chủ, dân", "mk": "ngày 1", "vc": "Lời kể dân làng về tục thỉnh Long Vương.", "dt": "Dân không tin thuốc, không đắp đê vì thờ Long Vương. Mỗi năm Bá gia thỉnh Long Vương từ sông lên cầu qua mùa lũ.", "tt": "Màn 2"}, {"t": "Miếu Long Vương: con cá chép", "dd": "Miếu Long Vương", "ai": "thầy cúng, dân", "mk": "ngày 1", "vc": "Cá chép thường vừa thay mới; vảy cá lẫn bùn.", "dt": "Người chơi nhận ra 'Long Vương' chỉ là một con cá chép thường; mỗi đời gia chủ giết cá cũ, chọn cá mới để biểu trưng luân hồi.", "tt": "Màn 3"}, {"t": "Đê sông: đê dởm", "dd": "Đê sông", "ai": "thợ đê", "mk": "sau sổ chi", "vc": "Sổ chi tiền đắp đê; đoạn đê gỗ mục trộn đất.", "dt": "Tiền đắp đê rất lớn nhưng đê sơ sài, lũ tăng thì gọi là thần cá hiển linh.", "tt": "Màn 4"}, {"t": "Kho tiền đê: Trần Tiêu", "dd": "Kho tiền đê", "ai": "Trần Tiêu", "mk": "sau khi thấy đê dởm", "vc": "Thư Trần Tiêu; sổ kho tiền đê.", "dt": "Trần Tiêu, mưu sĩ cũ của Bách Hải, dùng lại thủ đoạn thu phục lòng người để bòn tiền đắp đê vào túi riêng.", "tt": "Màn 5"}, {"t": "Nhà cũ Lý Hiểu: backstory", "dd": "Nhà cũ Lý Hiểu", "ai": "di vật", "mk": "sau lời kể", "vc": "Nhật ký Lý Hiểu nhắc thư tình với Vương Tài.", "dt": "Lý Hiểu cưới Bá Vinh, truyền y thuật, đẩy lùi mê tín; thiên tai trùng binh biến, triều đình không đáp. Bản thật: bà tư thông Vương Tài, để Bá Vinh chết đói rồi giả chết trở về. Trịnh Huy, học trò bà, hắc hóa và tuồn kho lương.", "tt": "Nối vào án chính qua Trịnh Huy và Vương Tài."}], "ds": "Trần Tiêu | mưu sĩ cũ Bách Hải, bòn tiền đắp đê | màn 4\nGia chủ Bá gia | giữ tục thờ cá chép | màn 1, 2\nThầy cúng, dân làng | tin Long Vương, không đắp đê | màn 1, 2\nThợ đê | biết đê làm sơ sài | màn 3\nLý Hiểu | thầy thuốc, người kế thừa Bá gia thời trước | màn 5 (qua hồ sơ)\nBá Vinh | chồng Lý Hiểu, chết đói | màn 5\nVương Tài | người Lý Hiểu tư thông | màn 5\nTrịnh Huy | học trò Lý Hiểu | màn 5 (liên đới)", "mv": "[Chính] Điều tra vì sao đê hỏng | dân nhờ | tìm ra Trần Tiêu và sổ chi tiền | thưởng: dân tin, đê được sửa\n[Phụ] Bảo vệ dân khỏi mùa lũ | gia chủ Bá gia | di dời dân kịp thời | thưởng: sống sót\n[Phụ] Phá mê tín bằng chứng cứ cá chép | tự làm | dân chịu đắp đê thật | thưởng: danh tiếng\n[Ẩn] Tìm hồ sơ Lý Hiểu | tự phát hiện | có nhật ký | thưởng: nối với Trịnh Huy"}];
function gen(c){const L=[(c.name||"").toUpperCase()];
 if(c.tom)L.push("TÓM TẮT\n"+c.tom);
 if(c.ct)L.push("CHÂN TƯỚNG VÀ DÒNG THỜI GIAN\n"+c.ct);
